name = "blog-visits"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Hourly, so a failed daily fetch of the model lists is retried; runs before 06:00 Tokyo do nothing.
[triggers]
crons = ["0 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://zoooooone.github.io,http://localhost:4321"

[[d1_databases]]
binding = "DB"
database_name = "blog-visits"
# Fill in after `wrangler d1 create blog-visits`.
database_id = "a280adf0-2ca9-4ded-af3c-3fcd2b75804d"
